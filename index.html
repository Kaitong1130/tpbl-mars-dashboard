<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>臺北台新戰神｜球員數據儀表板</title>
  <style>
    :root {
      --bg: #0e1015;
      --surface: #171a22;
      --surface-2: #1f2430;
      --border: #2c3242;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --mars-red: #e02834;
      --mars-gold: #e5b869;
      --green: #22c55e;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background: radial-gradient(circle at top right, #231418 0%, var(--bg) 42%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 18px 48px;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-bar {
      width: 6px;
      height: 38px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--mars-red), var(--mars-gold));
    }

    .brand h1 {
      font-size: 1.45rem;
      letter-spacing: 0.5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .status-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
    }

    .status-dot.updating {
      background: var(--amber);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .btn {
      background: var(--mars-red);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* Selector Card */
    .selector-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 22px;
    }

    .player-identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .jersey-badge {
      background: linear-gradient(135deg, var(--mars-red), #9e1620);
      color: #fff;
      font-weight: 800;
      font-size: 1.25rem;
      min-width: 58px;
      height: 50px;
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(224, 40, 52, 0.28);
    }

    .player-name {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .player-note {
      font-size: 0.82rem;
      color: var(--mars-gold);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.98rem;
      min-width: 210px;
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: var(--mars-red); }

    /* 6 Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .tag-total {
      background: rgba(224, 40, 52, 0.16);
      color: #ff6b74;
      border: 1px solid rgba(224, 40, 52, 0.35);
    }

    .tag-avg {
      background: rgba(229, 184, 105, 0.14);
      color: var(--mars-gold);
      border: 1px solid rgba(229, 184, 105, 0.35);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 10px;
    }

    .stat-box {
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 11px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.32rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.na {
      color: #6b7280;
    }

    .error-banner {
      display: none;
      background: rgba(224, 40, 52, 0.15);
      border: 1px solid var(--mars-red);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.88rem;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-bar"></div>
        <div>
          <h1>臺北台新戰神｜球員數據儀表板</h1>
          <p id="seasonSubtitle">載入賽季資料中...</p>
        </div>
      </div>

      <div class="status-panel">
        <div>
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">連線中...</span>
        </div>
        <span style="color: var(--border)">|</span>
        <div style="color: var(--muted)">
          上次更新：<strong id="lastUpdated" style="color: var(--text)">--</strong>
        </div>
        <div style="color: var(--muted)">
          下次 API：<strong id="countdown" style="color: var(--mars-gold)">--</strong>
        </div>
        <button id="refreshBtn" class="btn" onclick="triggerRefresh()">立即更新</button>
      </div>
    </header>

    <div id="errorBanner" class="error-banner"></div>

    <section class="selector-bar">
      <div class="player-identity">
        <div id="jerseyBadge" class="jersey-badge">--</div>
        <div>
          <div id="playerName" class="player-name">請選擇球員</div>
          <div id="playerNote" class="player-note"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-ghost" onclick="stepPlayer(-1)">← 上一位</button>
        <select id="playerSelect" onchange="onSelectChange()"></select>
        <button class="btn btn-ghost" onclick="stepPlayer(1)">下一位 →</button>
      </div>
    </section>

    <main id="cardsArea" class="grid">
      <div class="empty-state" style="grid-column: 1 / -1;">
        正在載入球員數據，若剛啟動服務請稍候約 20 秒完成首次 API 抓取...
      </div>
    </main>
  </div>

  <script>
    let allPlayers = [];
    let selectedName = localStorage.getItem("mars_selected_player") || "";

    const TPBL_TOTAL_KEYS = ["出賽場次", "得分", "籃板", "助攻", "抄截", "阻攻", "三分球命中數"];
    const TPBL_AVG_KEYS = ["出賽場次", "平均得分", "平均籃板", "平均助攻", "平均抄截", "平均阻攻", "平均三分球命中數"];
    const CAREER_TOTAL_KEYS = ["出賽場次", "得分", "籃板", "助攻", "抄截", "阻攻"];
    const CAREER_AVG_KEYS = ["出賽場次", "平均得分", "平均籃板", "平均助攻", "平均抄截", "平均阻攻"];

    function formatValue(val, isAvg, key) {
      if (val === null || val === undefined) return { text: "-", isNa: true };
      if (isAvg && key !== "出賽場次") {
        return { text: Number(val).toFixed(1), isNa: false };
      }
      return { text: String(val), isNa: false };
    }

    function renderCard(title, badgeText, badgeClass, dataObj, keys, isAvg) {
      const boxes = keys.map((key) => {
        const { text, isNa } = formatValue(dataObj ? dataObj[key] : null, isAvg, key);
        const label = key.replace(/^平均/, "");
        return `
          <div class="stat-box">
            <div class="stat-label">${label}</div>
            <div class="stat-value ${isNa ? "na" : ""}">${text}</div>
          </div>
        `;
      }).join("");

      return `
        <article class="card">
          <div class="card-header">
            <div class="card-title">${title}</div>
            <span class="tag ${badgeClass}">${badgeText}</span>
          </div>
          <div class="stats-row">${boxes}</div>
        </article>
      `;
    }

    function renderSelectedPlayer() {
      const area = document.getElementById("cardsArea");
      if (!allPlayers.length) {
        area.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">尚無球員數據，正在等待第一次 API 同步完成...</div>`;
        return;
      }

      let player = allPlayers.find((p) => p.name === selectedName);
      if (!player) {
        player = allPlayers[0];
        selectedName = player.name;
        document.getElementById("playerSelect").value = selectedName;
      }

      document.getElementById("jerseyBadge").textContent = player.jersey || "#--";
      document.getElementById("playerName").textContent = player.name;

      const hasCareer = player.career_total && player.career_total["出賽場次"] !== null;
      document.getElementById("playerNote").textContent = hasCareer
        ? "生涯數據含過往聯賽累積（僅供參考）"
        : "洋將／外籍球員：表格未收錄過往生涯數據";

      area.innerHTML = [
        renderCard("本季累計數據", "累計", "tag-total", player.season_total, TPBL_TOTAL_KEYS, false),
        renderCard("本季平均數據", "場均", "tag-avg", player.season_avg, TPBL_AVG_KEYS, true),
        renderCard("TPBL 累計數據", "累計", "tag-total", player.tpbl_total, TPBL_TOTAL_KEYS, false),
        renderCard("TPBL 平均數據", "場均", "tag-avg", player.tpbl_avg, TPBL_AVG_KEYS, true),
        renderCard("生涯累計數據", "累計", "tag-total", player.career_total, CAREER_TOTAL_KEYS, false),
        renderCard("生涯平均數據", "場均", "tag-avg", player.career_avg, CAREER_AVG_KEYS, true),
      ].join("");
    }

    function populateDropdown(players) {
      const select = document.getElementById("playerSelect");
      const currentVal = selectedName;

      select.innerHTML = players.map((p) => {
        const label = p.jersey ? `${p.jersey} ${p.name}` : p.name;
        return `<option value="${p.name}">${label}</option>`;
      }).join("");

      if (players.some((p) => p.name === currentVal)) {
        select.value = currentVal;
      } else if (players.length > 0) {
        selectedName = players[0].name;
        select.value = selectedName;
      }
    }

    function onSelectChange() {
      selectedName = document.getElementById("playerSelect").value;
      localStorage.setItem("mars_selected_player", selectedName);
      renderSelectedPlayer();
    }

    function stepPlayer(delta) {
      if (!allPlayers.length) return;
      const idx = allPlayers.findIndex((p) => p.name === selectedName);
      const nextIdx = (idx + delta + allPlayers.length) % allPlayers.length;
      selectedName = allPlayers[nextIdx].name;
      localStorage.setItem("mars_selected_player", selectedName);
      document.getElementById("playerSelect").value = selectedName;
      renderSelectedPlayer();
    }

    async function fetchState() {
      try {
        const res = await fetch("/api/players", { cache: "no-store" });
        const data = await res.json();

        document.getElementById("seasonSubtitle").textContent = data.season_name
          ? `${data.season_name} 賽季｜自動串接 TPBL 官方 API 與賽前 Baseline`
          : "自動串接 TPBL 官方 API 與賽前 Baseline";

        const dot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        const refreshBtn = document.getElementById("refreshBtn");

        if (data.is_updating) {
          dot.classList.add("updating");
          statusText.textContent = "正在從 TPBL API 更新中...";
          refreshBtn.disabled = true;
        } else {
          dot.classList.remove("updating");
          statusText.textContent = "自動監控中（每 1 分鐘）";
          refreshBtn.disabled = false;
        }

        document.getElementById("lastUpdated").textContent = data.last_updated || "尚未完成首次 API 同步";
        document.getElementById("countdown").textContent =
          data.next_update_in !== null ? `${data.next_update_in} 秒` : "--";

        const errBanner = document.getElementById("errorBanner");
        if (data.last_error) {
          errBanner.style.display = "block";
          errBanner.textContent = `最近一次 API 同步發生異常（將於下分鐘自動重試）：${data.last_error}`;
        } else {
          errBanner.style.display = "none";
        }

        if (data.players && data.players.length > 0) {
          allPlayers = data.players;
          populateDropdown(allPlayers);
          renderSelectedPlayer();
        }
      } catch (err) {
        document.getElementById("statusText").textContent = "無法連線至本機服務";
      }
    }

    async function triggerRefresh() {
      document.getElementById("refreshBtn").disabled = true;
      await fetch("/api/refresh", { method: "POST" });
      await fetchState();
    }

    // 首次載入 + 每 3 秒向本機後端同步畫面狀態（不會重複打外部 TPBL API，外部固定由後端每分鐘打一次）
    fetchState();
    setInterval(fetchState, 3000);
  </script>
</body>
</html>
